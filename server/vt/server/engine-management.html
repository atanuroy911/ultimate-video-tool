<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>AI programs and models · Ultimate Video Tool Server</title><style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--accent:#0a66ff;--ok:#1f9d55;--ok-bg:rgba(52,199,89,.14);--warn:#b35c00;--err:#d70015}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2c2c2e;--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--accent:#3b8cff;--ok:#32d74b;--ok-bg:rgba(50,215,75,.16);--warn:#ffb340;--err:#ff453a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:22px 20px 32px}a{color:var(--accent);text-decoration:none}
h1{font-size:20px;font-weight:650;margin:10px 0 2px}h2{font-size:15px;font-weight:600;margin:0}h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
p{margin:0;color:var(--muted)}.small{font-size:12.5px;color:var(--muted)}
section{background:var(--card);border-radius:12px;box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.04);padding:16px;margin:12px 0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;margin-top:12px}
input,select{font:inherit;padding:8px 10px;border:.5px solid var(--line);border-radius:8px;min-width:0;width:100%;background:var(--fill);color:var(--text)}
input:focus,select:focus{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:0}
button{font:inherit;font-weight:500;padding:7px 14px;min-height:32px;background:var(--fill);color:var(--text);border:0;border-radius:8px;cursor:pointer}
button.primary,.actions button:first-child{background:var(--accent);color:#fff}button.secondary{background:var(--fill);color:var(--text)}button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.badge{font-size:12px;font-weight:500;border-radius:20px;background:var(--fill);color:var(--muted);padding:3px 9px}.ready{color:var(--ok);background:var(--ok-bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#message:empty{display:none}#model-plan{white-space:pre-wrap}.error{color:var(--err)}
.tabs{display:inline-flex;gap:2px;margin:16px 0 4px;padding:2px;border-radius:9px;background:var(--fill)}
.tabs button{background:none;color:var(--text);border-radius:7px;padding:5px 14px;min-height:28px;font-size:13px}.tabs button[aria-selected=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--fill);border-radius:8px;padding:10px 12px;margin:10px 0}
input[type=checkbox]{width:auto}
.pick{display:flex;gap:8px}.pick input{flex:1}
.browser{margin-top:8px;padding:10px;border-radius:10px;background:var(--fill);display:flex;flex-direction:column;gap:8px}
.browser .drives{display:flex;gap:6px;flex-wrap:wrap}.browser .drives button{font-size:12.5px;padding:4px 10px;min-height:0;border-radius:20px;background:var(--card)}
.browser .here{display:flex;gap:8px;align-items:center;font-size:13px;overflow-wrap:anywhere}
.browser ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;border-radius:8px;background:var(--card)}
.browser li button{width:100%;text-align:left;background:none;border-radius:0;font-weight:400}.browser li+li{border-top:.5px solid var(--line)}
.fit-fast{color:var(--ok)}.fit-slow{color:var(--warn)}[hidden]{display:none!important}
@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="/">‹ Server</a><h1>AI programs and models</h1><p id="computer" class="small">Checking this server…</p><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="engines">Programs</button><button role="tab" aria-selected="false" data-tab="install">Install new</button><button role="tab" aria-selected="false" data-tab="cards">Graphics cards</button></div>
<div id="message" role="status"></div><div id="engines" class="tab-panel"></div>
<section id="cards" class="tab-panel" hidden><div data-gpu-choice></div></section>
<section id="install" class="tab-panel" hidden><h2>Install a program</h2><p class="small">Video Tool installs its own copy, kept apart from programs you already have. It uses the card chosen under Graphics cards.</p><label>Program<select id="install-engine"><option value="comfy">Picture AI (ComfyUI): draws the pictures</option><option value="ollama">Writing AI (Ollama): plans and writes</option></select></label><label>Model<select id="install-model"></select><span id="install-model-fit" class="small"></span></label><label>Downloads folder<span class="pick"><input id="models" placeholder="Default folder"><button type="button" data-browse="models">Browse…</button></span><span class="small">The AI models go here. They are large.</span></label><div class="browser" data-for="models" hidden></div><label>Programs folder<span class="pick"><input id="programs" placeholder="Default folder"><button type="button" data-browse="programs">Browse…</button></span></label><div class="browser" data-for="programs" hidden></div><div class="actions"><button id="review">Check what downloads</button></div><div id="install-plan"></div><div class="actions"><button id="install-go" class="primary" hidden>Install</button></div></section><section id="prepare" hidden><h2>Picture models</h2><p id="model-name" class="small"></p><label>Model folder<select id="model-folder"></select></label><pre id="model-plan"></pre><div class="actions"><button id="prepare-go" class="primary">Use these models</button></div></section>
<section id="job" hidden><h2>Progress</h2><p id="job-status" role="status"></p><div class="actions"><button id="job-cancel" class="secondary">Cancel</button></div></section>
</main><script src="/gpu-choice.js"></script><script src="/manage.js"></script></body></html>
