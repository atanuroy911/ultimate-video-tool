<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ultimate Video Tool</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --text:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --card:#fff; --line:rgba(0,0,0,.08); --fill:rgba(118,118,128,.12); --err:#d70015; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --accent:#0a84ff; --card:#2c2c2e; --line:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24); --err:#ff453a; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:min(460px,90vw); padding:28px 0; }
  .logo { display:block; width:64px; height:64px; margin:0 auto 14px; }
  h1 { margin:0 0 4px; font-size:22px; font-weight:650; letter-spacing:-.01em; text-align:center; }
  .lead { margin:0 0 24px; color:var(--muted); text-align:center; }
  h2 { margin:22px 4px 8px; font-size:13px; font-weight:600; color:var(--muted); display:flex; align-items:center; justify-content:space-between; }
  .group { background:var(--card); border-radius:12px; box-shadow:0 0 0 .5px var(--line), 0 1px 2px rgba(0,0,0,.04); overflow:hidden; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 16px; min-height:52px; border:0; background:none; color:var(--text); font:inherit; cursor:pointer; }
  .opt + .opt, .group > .note + .opt { border-top:.5px solid var(--line); }
  .opt:hover { background:var(--fill); }
  .opt:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset:-3px; }
  .opt span:first-child { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .opt small { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .opt .go { color:var(--muted); font-size:18px; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:9px 12px; border-radius:8px; border:.5px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  input:focus { outline:3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset:0; }
  button.main { padding:9px 18px; border:0; border-radius:8px; font:inherit; font-weight:500; background:var(--accent); color:#fff; cursor:pointer; }
  button.main:disabled { opacity:.45; cursor:default; }
  .note { padding:12px 16px; font-size:13px; color:var(--muted); }
  #msg { margin:8px 4px 0; font-size:13px; color:var(--muted); min-height:1.4em; }
  #msg.err { color:var(--err); }
  .link { background:none; border:0; color:var(--accent); font:inherit; font-size:13px; font-weight:500; cursor:pointer; padding:0; }
</style></head>
<body><main>
  <img class="logo" src="../icon.png" alt="" onerror="this.onerror=null;this.src='build/icon.png'">
  <h1>Welcome to Ultimate Video Tool</h1>
  <p class="lead">Choose the server that makes your videos.</p>

  <div class="group">
    <button class="opt" id="here"><span><b>This computer</b><small>Ultimate Video Tool Server installed here</small></span><span class="go" aria-hidden="true">›</span></button>
  </div>

  <h2><span>On your network</span><button class="link" id="again">Search again</button></h2>
  <div class="group" id="found"><div class="note" id="looking">Looking…</div></div>

  <h2><span>Or type an address</span></h2>
  <form class="row" id="typed">
    <input id="addr" placeholder="192.168.1.20" spellcheck="false" autocomplete="off" aria-label="Server address">
    <button class="main" id="go" type="submit">Connect</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script>
  const $ = (i) => document.getElementById(i);
  const D = window.vtDesktop;
  $("here").onclick = () => D.useThisComputer();
  function row(s) {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = "<span><b></b><small></small></span><span class='go' aria-hidden='true'>›</span>";
    b.querySelector("b").textContent = s.name;
    b.querySelector("small").textContent = s.url.replace(/^https?:\/\//, "");
    b.onclick = () => D.connect(s.url);
    return b;
  }
  async function look() {
    $("found").innerHTML = "<div class='note'>Looking…</div>";
    const list = await D.find();
    $("found").innerHTML = "";
    if (!list.length) $("found").innerHTML = "<div class='note'>No server found. Open Ultimate Video Tool Server on the computer that makes your videos, then search again.</div>";
    for (const s of list) $("found").appendChild(row(s));
  }
  $("again").onclick = look;
  $("typed").onsubmit = async (e) => {
    e.preventDefault();
    $("go").disabled = true;
    $("msg").className = "";
    $("msg").textContent = "Connecting…";
    const r = await D.connect($("addr").value);
    $("go").disabled = false;
    if (r && r.error) { $("msg").className = "err"; $("msg").textContent = r.error; } else $("msg").textContent = "";
  };
  look();
</script>
</body></html>
