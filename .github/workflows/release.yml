# Builds every download from one tag:
#   Video Tool          the app (client + the ability to set the engines up on the same computer): .exe, .dmg, .AppImage, .deb
#   Video Tool Engine   the server for a GPU computer: one .zip / .tar.gz for Windows, Linux and macOS, and a Docker image on ghcr.io
# When it runs:
#   every push to main       builds everything and publishes the next patch release (v1.0.0 -> v1.0.1 ...), tagged on that commit.
#                            Pushes that only touch docs are skipped; put [skip release] in the commit message to skip one by hand.
#   a pushed tag like v1.2.0 publishes exactly that version (use it for minor and major steps; later pushes count on from it).
#   by hand (Actions tab)    builds everything; publishes only when "publish" is ticked.
# The CI workflow runs first, so a release is never built from code that fails it.
# Nothing is code-signed (see README, "Installing"). The version is written into every file by scripts/set_version.py.
name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.0 (empty: the next patch after the newest tag)"
        required: false
        default: ""
      publish:
        description: "Publish it as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# one release at a time, in push order; a newer push never cancels a release that is half published
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          next_patch() {
            # the newest plain vX.Y.Z tag, plus one; with no tag yet, the version already in the files
            last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$last" ]; then python3 scripts/set_version.py --show; return; fi
            IFS=. read -r a b c <<< "${last#v}"; echo "$a.$b.$((c + 1))"
          }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)    v="${GITHUB_REF_NAME#v}"; p=true ;;
            push:branch) v="$(next_patch)"; p=true ;;
            *)           v="${REQUESTED_VERSION:-$(next_patch)}"; p="${REQUESTED_PUBLISH:-false}" ;;
          esac
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$v' is not a version like 1.2.0"; exit 1; }
          if [ "$p" = true ] && [ "$GITHUB_REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already released"; exit 1
          fi
          echo "Building v$v (publish: $p)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$p" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  app:
    name: ${{ matrix.edition }} installer (${{ matrix.os }})
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        edition: [client, server]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Version
        shell: bash
        run: python scripts/set_version.py "${{ needs.version.outputs.version }}"
      - name: FFmpeg for the bundled music and sounds (server only)
        if: matrix.edition == 'server'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install ffmpeg -y --no-progress >/dev/null; else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
      - name: Processing assets (server only)
        if: matrix.edition == 'server'
        shell: bash
        run: |
          pip install pillow numpy soundfile
          cd server/renderer && npm ci --no-audit --no-fund && node scripts/build-fonts.mjs && node scripts/build-icons.mjs && cd ../..
          python scripts/make_texture.py
          python scripts/make_assets.py
      - name: Client editor (client only)
        if: matrix.edition == 'client'
        shell: bash
        run: cd client/studio && npm ci --no-audit --no-fund && npm run build
      - name: Installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd ${{ matrix.edition }}/desktop
          npm ci --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.edition }}-${{ matrix.os }}
          path: |
            client/desktop/dist/*.exe
            client/desktop/dist/*.AppImage
            client/desktop/dist/*.deb
            server/desktop/dist/*.exe
            server/desktop/dist/*.AppImage
            server/desktop/dist/*.deb
          if-no-files-found: error

  engine:
    name: Engine package
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/set_version.py "${{ needs.version.outputs.version }}"
      - run: python scripts/make_engine_package.py --out dist --version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: dist/*
          if-no-files-found: error

  engine-smoke:
    name: Install the released package (${{ matrix.os }})
    needs: engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: engine-package, path: pkg }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unpack
        shell: bash
        run: python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('pkg/video-tool-engine-*.zip')[0]).extractall('unpacked')"
      - name: Install and prove the engine answers (Linux)
        if: runner.os == 'Linux'
        run: bash unpacked/video-tool-engine/install-engine.sh --check --dir "$RUNNER_TEMP/engine"
      - name: Install and prove the engine answers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./unpacked/video-tool-engine/install-engine.ps1 -Check -Dir "$env:RUNNER_TEMP/engine"

  engine-image:
    name: Engine Docker image
    needs: [engine, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: engine-package, path: pkg }
      - name: Unpack as the build context
        run: python3 -c "import glob,zipfile; zipfile.ZipFile(glob.glob('pkg/video-tool-engine-*.zip')[0]).extractall('ctx')"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/video-tool-engine" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ctx/video-tool-engine
          platforms: linux/amd64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish the release
    if: needs.version.outputs.publish == 'true'
    needs: [version, app, engine, engine-smoke, engine-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "app-*", path: out, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: engine-package, path: out }
      - name: Checksums
        run: |
          # the installers arrive as client/desktop/dist/... and server/desktop/dist/...: one flat folder of downloads
          find out -mindepth 2 -type f -exec mv -n {} out/ \;
          find out -mindepth 1 -type d -empty -delete
          cd out
          rm -f SHA256SUMS-engine.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ultimate Video Tool ${{ needs.version.outputs.version }}
          make_latest: "true"
          files: out/*
          generate_release_notes: true
          body: |
            **Ultimate Video Tool**: Windows `.exe` and Linux `.AppImage` / `.deb`.
            **Ultimate Video Tool Server**: separately installable Windows and Linux edition with server management and processing APIs; no editor bundle.
            **Headless GPU helper** (the server for a GPU computer): `video-tool-engine-*.zip` or `.tar.gz`, or `docker pull ghcr.io/${{ github.repository_owner }}/video-tool-engine:${{ needs.version.outputs.version }}`.
            Install the client to edit locally or connect to a server. Install the Server edition on the computer doing the processing; its manager connects engines and approves client devices. Headless GPU helpers remain available as archives.
            Nothing is code-signed: Windows may warn on first open.
