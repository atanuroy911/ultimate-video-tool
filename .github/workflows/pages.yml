# Publishes the project website (docs/index.html and docs/assets/) to GitHub Pages.
# Only the site files are published, not the rest of docs/ (plans, evidence, test logs).
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          cp docs/index.html _site/
          cp -r docs/assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
