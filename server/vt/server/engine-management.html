<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>Server settings · Ultimate Video Tool</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1d2941;font:15px system-ui,sans-serif;line-height:1.5}main{max-width:880px;margin:34px auto;padding:24px}h1{font-size:30px;letter-spacing:-1px;margin:12px 0 4px}h2{font-size:18px;margin:0}p{color:#637086}a{color:#2563eb}section{background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:22px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}label{display:flex;flex-direction:column;gap:7px;font-weight:600}input,select{font:inherit;padding:11px;border:1px solid #ccd5e3;border-radius:9px;min-width:0;width:100%;background:white;color:#1d2941}button{font:600 14px system-ui;padding:10px 15px;background:#2563eb;color:white;border:0;border-radius:9px;cursor:pointer}button.secondary{background:#eef2f8;color:#243d63}button:disabled{opacity:.5;cursor:default}.badge{font-size:13px;border-radius:20px;background:#eef2f7;padding:5px 10px}.ready{color:#167343;background:#e5f5eb}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.small{font-size:13px;color:#637086}#message{white-space:pre-wrap;overflow-wrap:anywhere}#model-plan{white-space:pre-wrap}.error{color:#aa3126}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:#e6ebf4;color:#304363}.tabs button[aria-selected=true]{background:#2563eb;color:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}input[type=checkbox]{width:auto}code{user-select:all;font-size:22px}[hidden]{display:none!important}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="/">← Server overview</a><h1>Server settings</h1><p id="computer">Checking this processing computer…</p><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="engines">Engines</button><button role="tab" aria-selected="false" data-tab="install">Install</button><button role="tab" aria-selected="false" data-tab="clients">Clients</button></div>
<div id="message" role="status"></div><div id="engines" class="tab-panel"></div>
<section id="install" class="tab-panel" hidden><h2>Install a separate managed copy</h2><p class="small">Choose folders on this server. Existing engines stay in place.</p><div class="grid"><label>Programs folder<input id="programs" placeholder="Use the server’s default folder"></label><label>Models folder<input id="models" placeholder="Use the server’s default folder"></label><label>Graphics card<select id="gpu"></select></label><label>Programs to install<select id="install-engine"><option value="comfy">ComfyUI · pictures and voices</option><option value="ollama">Ollama · language AI</option></select></label></div><button id="review">Review download</button><div id="install-plan"></div><button id="install-go" hidden>Install reviewed plan</button></section>
<section id="clients" class="tab-panel" hidden><h2>Connected clients</h2><p id="client-note" class="small"></p><button id="new-code">Get connection code</button><p><code id="pair-code"></code></p><div id="client-list"></div></section>
<section id="prepare" hidden><h2>Picture models</h2><p id="model-name"></p><label>Model folder<select id="model-folder"></select></label><pre id="model-plan"></pre><button id="prepare-go">Use these models</button></section>
<section id="job" hidden><h2>Progress</h2><p id="job-status" role="status"></p><button id="job-cancel" class="secondary">Cancel</button></section>
</main><script src="/manage.js"></script></body></html>
